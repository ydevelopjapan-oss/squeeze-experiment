<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>スクイーズ実験</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
  /* 操作中の文字選択・画像ドラッグを禁止 */
html, body, main, .pad, .pad * {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

.pad {
  touch-action: none;
  cursor: grab;
}

.pad:active {
  cursor: grabbing;
}
body {
  margin: 0; min-height: 100svh; display: grid; place-items: center;
  padding: 24px 16px; background: #f4f1eb; color: #4d4b48;
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
  touch-action: manipulation;
}
main { width: min(100%, 520px); text-align: center; }
h1 { font-size: 21px; font-weight: 650; letter-spacing: .04em; margin: 0 0 8px; }
.lead { margin: 0 0 18px; font-size: 13px; color: #817d77; }
.pad {
  position: relative; width: 100%; aspect-ratio: 1 / 1;
  display: grid; place-items: center; border-radius: 28px;
  background: linear-gradient(145deg,#fffefa,#e9e4da);
  box-shadow: inset 0 2px 8px #ffffff, 0 12px 30px #6c62501c;
  overflow: hidden; touch-action: none; user-select: none;
}
svg { width: 88%; height: 88%; overflow: visible; touch-action: none; }
#piece { filter: none; transform-origin: 150px 150px; }
#piece-shape { fill: url(#skin); stroke: #b77d78; stroke-width: 1.2; stroke-linejoin: round; }
#dent { opacity: 0; pointer-events: none; }
#dentShade { fill: url(#dentGradient); }
#dentRim { fill: url(#rimGradient); }
.hint { margin: 16px 0 0; font-size: 14px; min-height: 1.5em; }
.sub { margin: 5px 0 0; font-size: 12px; color: #918b83; }
button {
  margin-top: 18px; border: 1px solid #d7d0c5; background: #fffdf8; color: #625d55;
  padding: 10px 22px; border-radius: 999px; font-size: 14px;
}
button:active { transform: scale(.98); }
</style>
</head>
<body>
<main>
  <h1>スクイーズ実験</h1>
  <p class="lead">1ピースだけで、押したときの変形を試します</p>
  <div class="pad" id="pad" aria-label="押して変形させるエリア">
    <svg viewBox="0 0 300 300" role="img" aria-label="5マスの柔らかいピース">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#f5b9ae"/>
          <stop offset=".48" stop-color="#e99b91"/>
          <stop offset="1" stop-color="#c97875"/>
        </linearGradient>
        <radialGradient id="dentGradient">
          <stop offset="0" stop-color="#754b50" stop-opacity=".62"/>
          <stop offset=".34" stop-color="#9b5e60" stop-opacity=".35"/>
          <stop offset=".82" stop-color="#a96668" stop-opacity=".08"/>
          <stop offset="1" stop-color="#a96668" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="rimGradient">
          <stop offset=".30" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".36" stop-color="#f2eee6" stop-opacity=".38"/>
          <stop offset=".72" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="squish" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feImage id="mapImage" result="map" x="0" y="0" width="300" height="300" preserveAspectRatio="none"/>
          <feDisplacementMap id="warp" in="SourceGraphic" in2="map" scale="0" xChannelSelector="R" yChannelSelector="G"/>
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.8" result="blur"/>
          <feOffset in="blur" dx="0" dy="5" result="offset"/>
          <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.30 0 0 0 0 0.20 0 0 0 0 0.20 0 0 0 .18 0" result="shadow"/>
          <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="piece">
        <!-- T字型の5マスを、ひとつながりの輪郭として描画 -->
        <path id="piece-shape" d="M78 64 Q78 48 94 48 H206 Q222 48 222 64 V126 Q222 142 206 142 H174 V236 Q174 252 158 252 H142 Q126 252 126 236 V142 H94 Q78 142 78 126 Z"/>
        <g id="dent">
          <circle id="dentShade" cx="150" cy="130" r="72"/>
          <circle id="dentRim" cx="150" cy="130" r="84"/>
        </g>
      </g>
    </svg>
  </div>
  <p class="hint" id="hint">ピースを指で押してみてね</p>
  <p class="sub">押している間だけ変形し、指を離すと元に戻ります</p>
  <button id="reset" type="button">元の形に戻す</button>
</main>
<script>
(() => {
  const pad = document.getElementById('pad');
  const warp = document.getElementById('warp');
  const mapImage = document.getElementById('mapImage');
  const dent = document.getElementById('dent');
  const shade = document.getElementById('dentShade');
  const rim = document.getElementById('dentRim');
  const hint = document.getElementById('hint');
  const reset = document.getElementById('reset');

  const W = 300, H = 300, SCALE = 44, RADIUS = 30;
  const mapCanvas = document.createElement('canvas');
  mapCanvas.width = W; mapCanvas.height = H;
  const mapCtx = mapCanvas.getContext('2d', { willReadFrequently: true });
  let active = false, point = null, pointerId = null;

  function makeMap(px, py) {
    const img = mapCtx.createImageData(W, H);
    const data = img.data;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const dx = px - x, dy = py - y;
        const dist = Math.hypot(dx, dy);
        const influence = Math.exp(-(dist * dist) / (2 * RADIUS * RADIUS));
        // 押した中心へ周囲の画素を引き寄せ、中央に局所的なくぼみを作る
        const shiftX = dx * influence * 0.82;
        const shiftY = dy * influence * 0.82;
        const i = (y * W + x) * 4;
        data[i] = Math.max(0, Math.min(255, 128 + shiftX / SCALE * 255));
        data[i + 1] = Math.max(0, Math.min(255, 128 + shiftY / SCALE * 255));
        data[i + 2] = 128;
        data[i + 3] = 255;
      }
    }
    mapCtx.putImageData(img, 0, 0);
    mapImage.setAttribute('href', mapCanvas.toDataURL('image/png'));
  }

  function localPoint(e) {
    const svg = pad.querySelector('svg');
    const p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    return { x: q.x, y: q.y };
  }

  function press(e) {
    const p = localPoint(e);
    // ピースの輪郭付近を押したときだけ反応
    if (p.x < 70 || p.x > 230 || p.y < 40 || p.y > 260) return;
    active = true; pointerId = e.pointerId;
    pad.setPointerCapture(pointerId);
    point = p;
    update();
    hint.textContent = 'むにゅっ… 指を動かしてみて';
  }
  function move(e) {
    if (!active || e.pointerId !== pointerId) return;
    point = localPoint(e);
    update();
  }
  function release(e) {
    if (!active || (e && e.pointerId !== pointerId)) return;
    active = false; pointerId = null; point = null;
    warp.setAttribute('scale', '0');
    dent.style.opacity = '0';
    hint.textContent = '元の形に戻ったよ';
  }
  function update() {
    if (!point) return;
    makeMap(point.x, point.y);
    warp.setAttribute('scale', String(SCALE));
    dent.style.opacity = '.95';
    shade.setAttribute('cx', point.x); shade.setAttribute('cy', point.y);
    rim.setAttribute('cx', point.x); rim.setAttribute('cy', point.y);
  }
  pad.addEventListener('pointerdown', press);
  pad.addEventListener('pointermove', move);
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);
  reset.addEventListener('click', () => release());
})();
</script>
</body>
</html>
