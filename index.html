
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>スクイーズ実験</title>

<style>
:root {
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: #f4f1eb;
  color: #4d4b48;
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
  touch-action: manipulation;
}

main {
  width: min(100%, 520px);
  text-align: center;
}

h1 {
  font-size: 21px;
  font-weight: 650;
  letter-spacing: .04em;
  margin: 0 0 8px;
}

.lead {
  margin: 0 0 18px;
  font-size: 13px;
  color: #817d77;
}

.pad {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  display: grid;
  place-items: center;
  border-radius: 28px;
  background: linear-gradient(145deg,#fffefa,#e9e4da);
  box-shadow: inset 0 2px 8px #ffffff, 0 12px 30px #6c62501c;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  cursor: grab;
}

.pad:active {
  cursor: grabbing;
}

svg {
  width: 88%;
  height: 88%;
  overflow: visible;
  pointer-events: none;
}

#piece {
  transform-origin: 150px 150px;
}

#dent {
  opacity: 0;
  pointer-events: none;
}

#dentShade {
  fill: url(#dentGradient);
}

#dentRim {
  fill: url(#rimGradient);
}

.hint {
  margin: 16px 0 0;
  font-size: 14px;
  min-height: 1.5em;
}

.sub {
  margin: 5px 0 0;
  font-size: 12px;
  color: #918b83;
}

button {
  margin-top: 18px;
  border: 1px solid #d7d0c5;
  background: #fffdf8;
  color: #625d55;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 14px;
}

button:active {
  transform: scale(.98);
}
#pressureReadout {
  position: absolute;
  left: 10px;
  bottom: 10px;
  z-index: 10;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.9);
  color: #594b4b;
  font-size: 12px;
  line-height: 1.6;
  pointer-events: none;
}
</style>
</head>

<body>
<main>
  <h1>スクイーズ実験</h1>
  <p class="lead">本編と同じ5個のクッションで、押したときの変形を試します</p>

  <div class="pad" id="pad" aria-label="押して変形させるエリア">

    <svg viewBox="0 0 300 300" role="img" aria-label="5マスの柔らかいピース">

      <defs>
        <radialGradient id="dentGradient">
          <stop offset="0" stop-color="#603b40" stop-opacity=".75"/>
          <stop offset=".34" stop-color="#854d52" stop-opacity=".45"/>
          <stop offset=".72" stop-color="#a96668" stop-opacity=".10"/>
          <stop offset="1" stop-color="#a96668" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="rimGradient">
          <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".50" stop-color="#f2eee6" stop-opacity=".38"/>
          <stop offset=".82" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>

        <filter id="cellShadow" x="-30%" y="-30%" width="170%" height="170%">
          <feDropShadow
            dx="3.36"
            dy="3.36"
            stdDeviation="3.84"
            flood-color="rgb(70,75,85)"
            flood-opacity=".22"/>
        </filter>
      </defs>

      <g id="piece">
        <g id="pieceCells"></g>

        <g id="dent">
          <circle id="dentShade" cx="150" cy="130" r="72"/>
          <circle id="dentRim" cx="150" cy="130" r="84"/>
        </g>
      </g>

    </svg>
<div id="pressureReadout">
  指で押してみてね
</div>
  </div>

  <p class="hint" id="hint">ピースを指で押してみてね</p>
  <p class="sub">押している間だけスクイーズし、指を離すと元に戻ります</p>

  <button id="reset" type="button">元の形に戻す</button>
</main>

<script>
(() => {
  const pad = document.getElementById('pad');
  const pieceCells = document.getElementById('pieceCells');
  const dent = document.getElementById('dent');
  const shade = document.getElementById('dentShade');
  const rim = document.getElementById('dentRim');
  const hint = document.getElementById('hint');
  const reset = document.getElementById('reset');

  // 本編 drawPiece() と同じクッション設定
  const size = 48;
  const originX = 78;
  const originY = 78;

  const protrude = size * 0.3;
  const seam = size * 0.02;
  const radius = size * 0.4;

  const cells = [
    [0, 0],
    [1, 0],
    [2, 0],
    [1, 1],
    [1, 2]
  ];

  const NS = 'http://www.w3.org/2000/svg';

  function lightenColor(hex, amount) {
    return adjustColor(hex, amount);
  }

  function darkenColor(hex, amount) {
    return adjustColor(hex, -amount);
  }

  function adjustColor(hex, amount) {
    const num = parseInt(hex.replace('#', ''), 16);

    const r = Math.max(0, Math.min(255, (num >> 16) + amount));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amount));
    const b = Math.max(0, Math.min(255, (num & 255) + amount));

    return `rgb(${r}, ${g}, ${b})`;
  }

  // クッションを本編と同じ順番で描画
  function drawCells() {
    const color = '#e99b91';

    const drawOrder = [...cells].sort((a, b) => {
      const da = a[0] + a[1];
      const db = b[0] + b[1];

      if (da !== db) return da - db;
      if (a[1] !== b[1]) return a[1] - b[1];
      return a[0] - b[0];
    });

    drawOrder.forEach(([cx, cy], index) => {
      const px = originX + cx * size - protrude;
      const py = originY + cy * size - protrude;

      const w = size + protrude - seam;
      const h = size + protrude - seam;

      const gradientId = `cellGradient${index}`;

      const gradient = document.createElementNS(NS, 'linearGradient');
      gradient.setAttribute('id', gradientId);
      gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
      gradient.setAttribute('x1', px);
      gradient.setAttribute('y1', py);
      gradient.setAttribute('x2', px + w);
      gradient.setAttribute('y2', py + h);

      const stops = [
        [0, lightenColor(color, 30)],
        [.5, color],
        [1, darkenColor(color, 18)]
      ];

      stops.forEach(([offset, stopColor]) => {
        const stop = document.createElementNS(NS, 'stop');
        stop.setAttribute('offset', offset);
        stop.setAttribute('stop-color', stopColor);
        gradient.appendChild(stop);
      });

      document.querySelector('defs').appendChild(gradient);

      const group = document.createElementNS(NS, 'g');

      const rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('x', px);
      rect.setAttribute('y', py);
      rect.setAttribute('width', w);
      rect.setAttribute('height', h);
      rect.setAttribute('rx', radius);
      rect.setAttribute('fill', `url(#${gradientId})`);
      rect.setAttribute('stroke', 'rgba(90,85,80,0.13)');
      rect.setAttribute('stroke-width', Math.max(0.7, size * 0.025));
      rect.setAttribute('filter', 'url(#cellShadow)');

      group.appendChild(rect);

      // 左上側の柔らかい光沢
      const highlight = document.createElementNS(NS, 'path');

      highlight.setAttribute(
        'd',
        `M ${px + radius} ${py + 2}
         H ${px + w - radius}
         M ${px + 2} ${py + radius}
         V ${py + h - radius}`
      );

      highlight.setAttribute('fill', 'none');
      highlight.setAttribute('stroke', 'rgba(255,255,255,0.42)');
      highlight.setAttribute('stroke-width', Math.max(1, size * 0.035));
      highlight.setAttribute('stroke-linecap', 'round');

      group.appendChild(highlight);
      pieceCells.appendChild(group);
    });
  }

  drawCells();

  let active = false;
  let point = null;
  let pointerId = null;

  function localPoint(e) {
    const svg = pad.querySelector('svg');
    const p = svg.createSVGPoint();

    p.x = e.clientX;
    p.y = e.clientY;

    const q = p.matrixTransform(svg.getScreenCTM().inverse());

    return { x: q.x, y: q.y };
  }

  function press(e) {
    e.preventDefault();

    const p = localPoint(e);

    // ピース付近を押したときだけ反応
    if (p.x < 60 || p.x > 240 || p.y < 60 || p.y > 240) return;

    active = true;
    pointerId = e.pointerId;

    pad.setPointerCapture(pointerId);

    point = p;
    update();

    hint.textContent = 'むにゅっ… 指を動かしてみて';
  }

  function move(e) {
    if (!active || e.pointerId !== pointerId) return;

    e.preventDefault();

    point = localPoint(e);
    update();
  }

  function release(e) {
    if (!active || (e && e.pointerId !== pointerId)) return;

    active = false;
    pointerId = null;
    point = null;

    dent.style.opacity = '0';

    hint.textContent = '元の形に戻ったよ';
  }

  function update() {
    if (!point) return;

    dent.style.opacity = '.95';

    shade.setAttribute('cx', point.x);
    shade.setAttribute('cy', point.y);

    rim.setAttribute('cx', point.x);
    rim.setAttribute('cy', point.y);
  }

  pad.addEventListener('pointerdown', press);
  pad.addEventListener('pointermove', move);
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);

  pad.addEventListener('selectstart', e => e.preventDefault());
  pad.addEventListener('dragstart', e => e.preventDefault());

  reset.addEventListener('click', () => {
    release();
  });
})();
const pressureReadout =
  document.getElementById('pressureReadout');

let pressStartTime = 0;

function showPressure(e) {
  const pressure = e.pressure;
  const elapsed = pressStartTime
    ? (performance.now() - pressStartTime) / 1000
    : 0;

  pressureReadout.innerHTML =
    `入力方式：${e.pointerType}<br>` +
    `圧力値：${pressure.toFixed(3)}<br>` +
    `経過時間：${elapsed.toFixed(2)} 秒`;
}

pad.addEventListener('pointerdown', e => {
  pressStartTime = performance.now();
  showPressure(e);
});

pad.addEventListener('pointermove', e => {
  if (e.buttons) {
    showPressure(e);
  }
});

pad.addEventListener('pointerup', e => {
  showPressure(e);
  pressStartTime = 0;
});

pad.addEventListener('pointercancel', () => {
  pressStartTime = 0;
  pressureReadout.textContent = '入力がキャンセルされました';
});

</script>
</body>
</html>
