
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>布クッション実験</title>

<style>
:root {
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: #f4f1eb;
  color: #4d4b48;
  font-family: system-ui, -apple-system, sans-serif;
  touch-action: manipulation;
}

main {
  width: min(100%, 520px);
  text-align: center;
}

h1 {
  font-size: 21px;
  margin: 0 0 8px;
}

.lead {
  margin: 0 0 18px;
  font-size: 13px;
  color: #817d77;
}

.pad {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 28px;
  background: linear-gradient(145deg,#fffefa,#e9e4da);
  box-shadow: inset 0 2px 8px #fff,
              0 12px 30px #6c62501c;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}

.pad:active {
  cursor: grabbing;
}

svg {
  width: 88%;
  height: 88%;
  overflow: visible;
  pointer-events: none;
}

#cushion {
  fill: url(#fabricGradient);
  stroke: rgba(90,65,65,.14);
  stroke-width: 1.5;
  filter: url(#shadow);
}

#dent {
  opacity: 0;
  pointer-events: none;
}

#wrinkles path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hint {
  margin: 16px 0 0;
  font-size: 14px;
  min-height: 1.5em;
}

.sub {
  margin: 5px 0 0;
  font-size: 12px;
  color: #918b83;
}

button {
  margin-top: 18px;
  border: 1px solid #d7d0c5;
  background: #fffdf8;
  color: #625d55;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 14px;
}

button:active {
  transform: scale(.98);
}
</style>
</head>

<body>
<main>
  <h1>布クッション実験</h1>
  <p class="lead">指で押して、布のシワと凹みを試します</p>

  <div class="pad" id="pad">
    <svg viewBox="0 0 300 300">

      <defs>
        <linearGradient id="fabricGradient"
          x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6b3aa"/>
          <stop offset=".48" stop-color="#e99b91"/>
          <stop offset="1" stop-color="#d77f7a"/>
        </linearGradient>

<radialGradient id="dentGradient">
  <stop offset="0" stop-color="#804f53" stop-opacity=".22"/>
  <stop offset=".25" stop-color="#92575b" stop-opacity=".28"/>
  <stop offset=".55" stop-color="#a96668" stop-opacity=".16"/>
  <stop offset=".82" stop-color="#b77b79" stop-opacity=".06"/>
  <stop offset="1" stop-color="#b77b79" stop-opacity="0"/>
</radialGradient>

     //   <radialGradient id="rimGradient">
     //     <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
     //     <stop offset=".68" stop-color="#fff0e9" stop-opacity=".45"/>
     //     <stop offset="1" stop-color="#fff" stop-opacity="0"/>
     //   </radialGradient>

        <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
          <feDropShadow dx="3.3" dy="3.3"
            stdDeviation="3.8"
            flood-color="#464b55"
            flood-opacity=".22"/>
        </filter>

        <clipPath id="cushionClip">
          <rect x="70" y="70" width="160" height="160" rx="48"/>
        </clipPath>
      </defs>

      <!-- クッション本体 -->
      <rect id="cushion"
        x="70" y="70"
        width="160" height="160"
        rx="48"/>

      <!-- 凹みとシワ -->
      <g id="dent" clip-path="url(#cushionClip)">

        <circle id="dentShade"
          cx="150" cy="150" r="78"
          fill="url(#dentGradient)"/>

        <circle id="dentRim"
          cx="150" cy="150" r="88"
          fill="url(#rimGradient)"/>

        <g id="wrinkles"></g>
      </g>

    </svg>
  </div>

  <p class="hint" id="hint">クッションを指で押してみてね</p>
  <p class="sub">指を離すと、ゆっくり元に戻ります</p>

  <button id="reset" type="button">元の形に戻す</button>
</main>

<script>
(() => {
  const pad = document.getElementById('pad');
  const dent = document.getElementById('dent');
  const shade = document.getElementById('dentShade');
  const rim = document.getElementById('dentRim');
  const wrinkles = document.getElementById('wrinkles');
  const hint = document.getElementById('hint');
  const reset = document.getElementById('reset');
  const svg = pad.querySelector('svg');

  const NS = 'http://www.w3.org/2000/svg';

  let active = false;
  let pointerId = null;
  let point = null;

  let depth = 0;
  let startTime = 0;
  let releaseStart = 0;
  let releaseFrom = 0;
  let animationId = null;
  let releasing = false;

  // 凹みが立ち上がる速さ
  const PRESS_SPEED = 0.065;

  // 戻る時間
  const RELEASE_DURATION = 520;

  // 凹みの最大値
  const MAX_DEPTH = 1;

  function localPoint(e) {
    const p = svg.createSVGPoint();
    p.x = e.clientX;
    p.y = e.clientY;

    const q = p.matrixTransform(
      svg.getScreenCTM().inverse()
    );

    return { x: q.x, y: q.y };
  }

  function insideCushion(p) {
    return p.x >= 70 && p.x <= 230 &&
           p.y >= 70 && p.y <= 230;
  }

  // 放射状のシワを作る
    // 布が自然に寄る放射状のシワ
  function drawWrinkles(x, y, amount) {
    wrinkles.innerHTML = '';

    // 角度・長さ・曲がり方を不揃いにする
    const folds = [
      { angle: -2.0, length: 53, bend:  8 },
      { angle: -1.25, length: 42, bend: -6 },
      { angle: -0.55, length: 66, bend:  9 },
      { angle:  0.25, length: 49, bend: -8 },
      { angle:  0.95, length: 61, bend:  7 },
      { angle:  1.75, length: 45, bend: -9 },
      { angle:  2.45, length: 58, bend:  6 },
      { angle:  3.05, length: 43, bend: -7 }
    ];

    folds.forEach((fold, i) => {
      const a = fold.angle;
      const dx = Math.cos(a);
      const dy = Math.sin(a);

      const nx = -dy;
      const ny = dx;

      const start = 20;
      const end = fold.length;

      const sx = x + dx * start;
      const sy = y + dy * start;

      const ex = x + dx * end;
      const ey = y + dy * end;

      const bend = fold.bend;

      const c1x = x + dx * 34 + nx * bend;
      const c1y = y + dy * 34 + ny * bend;

      const c2x = x + dx * (end - 13) + nx * bend * .65;
      const c2y = y + dy * (end - 13) + ny * bend * .65;

      const d =
        `M ${sx} ${sy}
         C ${c1x} ${c1y},
           ${c2x} ${c2y},
           ${ex} ${ey}`;

      // 布が盛り上がる幅のある部分
      const soft = document.createElementNS(NS, 'path');
      soft.setAttribute('d', d);
      soft.setAttribute('stroke', '#a96366');
      soft.setAttribute('stroke-width', 7 * amount);
      soft.setAttribute('stroke-opacity', .13 * amount);

      // 折れ目の暗い谷
      const dark = document.createElementNS(NS, 'path');
      dark.setAttribute('d', d);
      dark.setAttribute('stroke', '#82484e');
      dark.setAttribute('stroke-width', 2.1 * amount);
      dark.setAttribute('stroke-opacity', .34 * amount);

      // 谷の隣にできる柔らかい光
      const light = document.createElementNS(NS, 'path');

      const offset = 2.5;

      const ld =
        `M ${sx + nx * offset} ${sy + ny * offset}
         C ${c1x + nx * offset} ${c1y + ny * offset},
           ${c2x + nx * offset} ${c2y + ny * offset},
           ${ex + nx * offset} ${ey + ny * offset}`;

      light.setAttribute('d', ld);
      light.setAttribute('stroke', '#fff1e9');
      light.setAttribute('stroke-width', 1.8 * amount);
      light.setAttribute('stroke-opacity', .48 * amount);

      wrinkles.appendChild(soft);
      wrinkles.appendChild(dark);
      wrinkles.appendChild(light);
    });
  }

  function updateVisual() {
    if (!point || depth <= 0.001) {
      dent.style.opacity = '0';
      return;
    }

    dent.style.opacity = String(depth);

    shade.setAttribute('cx', point.x);
    shade.setAttribute('cy', point.y);
    shade.setAttribute('r', 38 + depth * 42);

    rim.setAttribute('cx', point.x);
    rim.setAttribute('cy', point.y);
    rim.setAttribute('r', 48 + depth * 42);

    drawWrinkles(point.x, point.y, depth);
  }

  function animate(now) {
    if (active) {
      // 押した直後に急激に深くなり、その後は一定
      const elapsed = (now - startTime) / 1000;

      depth = MAX_DEPTH *
        (1 - Math.exp(-elapsed / PRESS_SPEED));

      depth = Math.min(depth, MAX_DEPTH);
    }

    if (releasing) {
      const t = Math.min(
        1,
        (now - releaseStart) / RELEASE_DURATION
      );

      // 自然にゆっくり戻る
      const eased = 1 - Math.pow(1 - t, 3);

      depth = releaseFrom * (1 - eased);

      if (t >= 1) {
        depth = 0;
        releasing = false;
        point = null;
        hint.textContent = '元の形に戻ったよ';
      }
    }

    updateVisual();

    if (active || releasing) {
      animationId = requestAnimationFrame(animate);
    } else {
      animationId = null;
    }
  }

  function startAnimation() {
    if (animationId === null) {
      animationId = requestAnimationFrame(animate);
    }
  }

  function press(e) {
    e.preventDefault();

    const p = localPoint(e);

    if (!insideCushion(p)) return;

    active = true;
    releasing = false;
    pointerId = e.pointerId;

    pad.setPointerCapture(pointerId);

    point = p;
    depth = 0;
    startTime = performance.now();

    hint.textContent = 'むにゅっ…';

    startAnimation();
  }

  function move(e) {
    if (!active || e.pointerId !== pointerId) return;

    e.preventDefault();

    point = localPoint(e);
    updateVisual();
  }

  function release(e) {
    if (!active) return;
    if (e && e.pointerId !== pointerId) return;

    active = false;
    pointerId = null;

    releasing = true;
    releaseStart = performance.now();
    releaseFrom = depth;

    startAnimation();
  }

  pad.addEventListener('pointerdown', press);
  pad.addEventListener('pointermove', move);
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);

  pad.addEventListener('selectstart', e => e.preventDefault());
  pad.addEventListener('dragstart', e => e.preventDefault());

  reset.addEventListener('click', () => {
    if (active) {
      active = false;
      pointerId = null;
    }

    releasing = true;
    releaseStart = performance.now();
    releaseFrom = depth;

    startAnimation();
  });

})();
</script>
</body>
</html>
