
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>布クッション実験</title>

<style>
:root {
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: #f4f1eb;
  color: #4d4b48;
  font-family: system-ui, -apple-system, sans-serif;
  touch-action: manipulation;
}

main {
  width: min(100%, 520px);
  text-align: center;
}

h1 {
  font-size: 21px;
  margin: 0 0 8px;
}

.lead {
  margin: 0 0 18px;
  font-size: 13px;
  color: #817d77;
}

.pad {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 28px;
  background: linear-gradient(145deg,#fffefa,#e9e4da);
  box-shadow: inset 0 2px 8px #fff,
              0 12px 30px #6c62501c;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}

.pad:active {
  cursor: grabbing;
}

svg {
  width: 88%;
  height: 88%;
  overflow: visible;
  pointer-events: none;
}

#cushion {
  fill: url(#fabricGradient);
  stroke: rgba(90,65,65,.14);
  stroke-width: 1.5;
  filter: url(#shadow);
}

#dent {
  opacity: 0;
  pointer-events: none;
}

#wrinkles path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hint {
  margin: 16px 0 0;
  font-size: 14px;
  min-height: 1.5em;
}

.sub {
  margin: 5px 0 0;
  font-size: 12px;
  color: #918b83;
}

button {
  margin-top: 18px;
  border: 1px solid #d7d0c5;
  background: #fffdf8;
  color: #625d55;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 14px;
}

button:active {
  transform: scale(.98);
}
</style>
</head>

<body>
<main>
  <h1>布クッション実験</h1>
  <p class="lead">指で押して、布のシワと凹みを試します</p>

  <div class="pad" id="pad">
    <svg viewBox="0 0 300 300">

      <defs>
        <linearGradient id="fabricGradient"
          x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6b3aa"/>
          <stop offset=".48" stop-color="#e99b91"/>
          <stop offset="1" stop-color="#d77f7a"/>
        </linearGradient>

        <radialGradient id="dentGradient">
          <stop offset="0" stop-color="#804f53" stop-opacity=".13"/>
          <stop offset=".3" stop-color="#92575b" stop-opacity=".19"/>
          <stop offset=".6" stop-color="#a96668" stop-opacity=".12"/>
          <stop offset=".85" stop-color="#b77b79" stop-opacity=".04"/>
          <stop offset="1" stop-color="#b77b79" stop-opacity="0"/>
        </radialGradient>

        <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
          <feDropShadow dx="3.3" dy="3.3"
            stdDeviation="3.8"
            flood-color="#464b55"
            flood-opacity=".22"/>
        </filter>

        <clipPath id="cushionClip">
          <rect x="70" y="70" width="160" height="160" rx="48"/>
        </clipPath>
      </defs>

      <rect id="cushion"
        x="70" y="70"
        width="160" height="160"
        rx="48"/>

      <g id="dent" clip-path="url(#cushionClip)">

        <ellipse id="dentShade"
          cx="150" cy="150"
          rx="78" ry="70"
          fill="url(#dentGradient)"/>

        <g id="wrinkles"></g>
      </g>

    </svg>
  </div>

  <p class="hint" id="hint">クッションを指で押してみてね</p>
  <p class="sub">指を離すと、ゆっくり元に戻ります</p>

  <button id="reset" type="button">元の形に戻す</button>
</main>

<script>
(() => {
  const pad = document.getElementById('pad');
  const dent = document.getElementById('dent');
  const shade = document.getElementById('dentShade');
  const wrinkles = document.getElementById('wrinkles');
  const hint = document.getElementById('hint');
  const reset = document.getElementById('reset');
  const svg = pad.querySelector('svg');

  const NS = 'http://www.w3.org/2000/svg';

  let active = false;
  let pointerId = null;
  let point = null;

  let depth = 0;
  let startTime = 0;
  let releaseStart = 0;
  let releaseFrom = 0;
  let animationId = null;
  let releasing = false;

  const PRESS_SPEED = 0.065;
  const RELEASE_DURATION = 520;
  const MAX_DEPTH = 1;

  function localPoint(e) {
    const p = svg.createSVGPoint();
    p.x = e.clientX;
    p.y = e.clientY;

    const q = p.matrixTransform(
      svg.getScreenCTM().inverse()
    );

    return { x: q.x, y: q.y };
  }

  function insideCushion(p) {
    return p.x >= 70 && p.x <= 230 &&
           p.y >= 70 && p.y <= 230;
  }

  // 凹みの周囲に沿う、短い弧状のシワ
  function drawWrinkles(x, y, amount) {
    wrinkles.innerHTML = '';

    const folds = [
      { angle: -2.35, radius: 31, length: 17, curve: 5 },
      { angle: -0.45, radius: 34, length: 19, curve: 6 },
      { angle:  1.65, radius: 29, length: 16, curve: 5 }
    ];

    folds.forEach((fold, index) => {
      // 深さに応じてシワを少しずつ増やす
      const threshold = [0.18, 0.48, 0.76][index];
      if (amount < threshold) return;

      const strength = Math.min(
        1,
        (amount - threshold) / 0.35
      );

      const a = fold.angle;

      // 指先の接触面を少し横長にする
      let rx = Math.cos(a);
      let ry = Math.sin(a) * 0.88;

      const len = Math.hypot(rx, ry);
      rx /= len;
      ry /= len;

      const tx = -ry;
      const ty = rx;

      const cx = x + rx * fold.radius;
      const cy = y + ry * fold.radius;

      const half = fold.length / 2;

      const sx = cx - tx * half;
      const sy = cy - ty * half;

      const ex = cx + tx * half;
      const ey = cy + ty * half;

      // シワの中央を凹み側へゆるく曲げる
      const qx = cx - rx * fold.curve;
      const qy = cy - ry * fold.curve;

      const d =
        `M ${sx} ${sy}
         Q ${qx} ${qy}
           ${ex} ${ey}`;

      function addStroke(path, color, width, opacity) {
        const el = document.createElementNS(NS, 'path');
        el.setAttribute('d', path);
        el.setAttribute('stroke', color);
        el.setAttribute('stroke-width', width);
        el.setAttribute('stroke-opacity', opacity);
        wrinkles.appendChild(el);
      }

      // 柔らかい影
      addStroke(
        d,
        '#a96366',
        6 * amount,
        .10 * strength
      );

      // シワの谷
      addStroke(
        d,
        '#82484e',
        2.0 * amount,
        .20 * strength
      );

      // 少し外側にできる淡い光
      const offset = 2.2;

      const lightPath =
        `M ${sx + rx * offset} ${sy + ry * offset}
         Q ${qx + rx * offset} ${qy + ry * offset}
           ${ex + rx * offset} ${ey + ry * offset}`;

      addStroke(
        lightPath,
        '#fff1e9',
        1.5 * amount,
        .30 * strength
      );
    });
  }

  function updateVisual() {
    if (!point || depth <= 0.001) {
      dent.style.opacity = '0';
      return;
    }

    dent.style.opacity = String(depth);

    shade.setAttribute('cx', point.x);
    shade.setAttribute('cy', point.y);
    shade.setAttribute('rx', 38 + depth * 42);
    shade.setAttribute('ry', (35 + depth * 38) * 0.88);

    drawWrinkles(point.x, point.y, depth);
  }

  function animate(now) {
    if (active) {
      const elapsed = (now - startTime) / 1000;

      depth = MAX_DEPTH *
        (1 - Math.exp(-elapsed / PRESS_SPEED));

      depth = Math.min(depth, MAX_DEPTH);
    }

    if (releasing) {
      const t = Math.min(
        1,
        (now - releaseStart) / RELEASE_DURATION
      );

      const eased = 1 - Math.pow(1 - t, 3);

      depth = releaseFrom * (1 - eased);

      if (t >= 1) {
        depth = 0;
        releasing = false;
        point = null;
        hint.textContent = '元の形に戻ったよ';
      }
    }

    updateVisual();

    if (active || releasing) {
      animationId = requestAnimationFrame(animate);
    } else {
      animationId = null;
    }
  }

  function startAnimation() {
    if (animationId === null) {
      animationId = requestAnimationFrame(animate);
    }
  }

  function press(e) {
    e.preventDefault();

    const p = localPoint(e);

    if (!insideCushion(p)) return;

    active = true;
    releasing = false;
    pointerId = e.pointerId;

    pad.setPointerCapture(pointerId);

    point = p;
    depth = 0;
    startTime = performance.now();

    hint.textContent = 'むにゅっ…';

    startAnimation();
  }

  function move(e) {
    if (!active || e.pointerId !== pointerId) return;

    e.preventDefault();

    point = localPoint(e);
    updateVisual();
  }

  function release(e) {
    if (!active) return;
    if (e && e.pointerId !== pointerId) return;

    active = false;
    pointerId = null;

    releasing = true;
    releaseStart = performance.now();
    releaseFrom = depth;

    startAnimation();
  }

  pad.addEventListener('pointerdown', press);
  pad.addEventListener('pointermove', move);
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);

  pad.addEventListener('selectstart', e => e.preventDefault());
  pad.addEventListener('dragstart', e => e.preventDefault());

  reset.addEventListener('click', () => {
    if (active) {
      active = false;
      pointerId = null;
    }

    releasing = true;
    releaseStart = performance.now();
    releaseFrom = depth;

    startAnimation();
  });

})();
</script>
</body>
</html>
