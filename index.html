
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>布クッション実験</title>

<style>
:root {
  color-scheme: light;
}

* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  background: #f4f1eb;
  color: #4d4b48;
  font-family: system-ui, -apple-system, sans-serif;
  touch-action: manipulation;
}

main {
  width: min(100%, 520px);
  text-align: center;
}

h1 {
  font-size: 21px;
  margin: 0 0 8px;
}

.lead {
  margin: 0 0 18px;
  font-size: 13px;
  color: #817d77;
}

.pad {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 28px;
  background: linear-gradient(145deg,#fffefa,#e9e4da);
  box-shadow: inset 0 2px 8px #fff,
              0 12px 30px #6c62501c;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}

.pad:active {
  cursor: grabbing;
}

svg {
  width: 88%;
  height: 88%;
  overflow: visible;
  pointer-events: none;
}

#cushion {
  fill: url(#fabricGradient);
  stroke: rgba(90,65,65,.14);
  stroke-width: 1.5;
  filter: url(#shadow);
}

#dent {
  opacity: 0;
  pointer-events: none;
}

#wrinkles path {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hint {
  margin: 16px 0 0;
  font-size: 14px;
  min-height: 1.5em;
}

.sub {
  margin: 5px 0 0;
  font-size: 12px;
  color: #918b83;
}

button {
  margin-top: 18px;
  border: 1px solid #d7d0c5;
  background: #fffdf8;
  color: #625d55;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 14px;
}

button:active {
  transform: scale(.98);
}
</style>
</head>

<body>
<main>
  <h1>布クッション実験</h1>
  <p class="lead">指で押して、布のシワと凹みを試します</p>

  <div class="pad" id="pad">
    <svg viewBox="0 0 300 300">

      <defs>
        <linearGradient id="fabricGradient"
          x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6b3aa"/>
          <stop offset=".48" stop-color="#e99b91"/>
          <stop offset="1" stop-color="#d77f7a"/>
        </linearGradient>

        <radialGradient id="dentGradient">
          <stop offset="0" stop-color="#804f53" stop-opacity=".13"/>
          <stop offset=".3" stop-color="#92575b" stop-opacity=".19"/>
          <stop offset=".6" stop-color="#a96668" stop-opacity=".12"/>
          <stop offset=".85" stop-color="#b77b79" stop-opacity=".04"/>
          <stop offset="1" stop-color="#b77b79" stop-opacity="0"/>
        </radialGradient>

        <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
          <feDropShadow dx="3.3" dy="3.3"
            stdDeviation="3.8"
            flood-color="#464b55"
            flood-opacity=".22"/>
        </filter>

        <clipPath id="cushionClip">
          <rect x="70" y="70" width="160" height="160" rx="48"/>
        </clipPath>
      </defs>

      <rect id="cushion"
        x="70" y="70"
        width="160" height="160"
        rx="48"/>

      <g id="dent" clip-path="url(#cushionClip)">

        <ellipse id="dentShade"
          cx="150" cy="150"
          rx="78" ry="70"
          fill="url(#dentGradient)"/>

        <g id="wrinkles"></g>
      </g>

    </svg>
  </div>

  <p class="hint" id="hint">クッションを指で押してみてね</p>
  <p class="sub">指を離すと、ゆっくり元に戻ります</p>

  <button id="reset" type="button">元の形に戻す</button>
</main>

<script>
(() => {
  const pad = document.getElementById('pad');
  const dent = document.getElementById('dent');
  const shade = document.getElementById('dentShade');
  const wrinkles = document.getElementById('wrinkles');
  const hint = document.getElementById('hint');
  const reset = document.getElementById('reset');
  const svg = pad.querySelector('svg');

  const NS = 'http://www.w3.org/2000/svg';

  let active = false;
  let pointerId = null;
  let point = null;

  let depth = 0;
  let startTime = 0;
  let releaseStart = 0;
  let releaseFrom = 0;
  let animationId = null;
  let releasing = false;

  const PRESS_SPEED = 0.065;
  const RELEASE_DURATION = 520;
  const MAX_DEPTH = 1;

  function localPoint(e) {
    const p = svg.createSVGPoint();
    p.x = e.clientX;
    p.y = e.clientY;

    const q = p.matrixTransform(
      svg.getScreenCTM().inverse()
    );

    return { x: q.x, y: q.y };
  }

  function insideCushion(p) {
    return p.x >= 70 && p.x <= 230 &&
           p.y >= 70 && p.y <= 230;
  }

 

function drawWrinkles(x, y, amount) {
  wrinkles.innerHTML = '';

  const folds = [
    { angle: -2.05, length: 48, bend:  4 },
    { angle: -1.05, length: 57, bend: -3 },
    { angle: -0.12, length: 45, bend:  5 },
    { angle:  0.82, length: 62, bend: -4 },
    { angle:  1.82, length: 51, bend:  3 },
    { angle:  2.75, length: 57, bend: -4 }
  ];

  // 曲線に沿って、根元から先端へ細くなる形を作る
  function taperedShape(points, startWidth, endWidth) {
    const left = [];
    const right = [];

    points.forEach((p, i) => {
      const t = i / (points.length - 1);
      const width = startWidth +
        (endWidth - startWidth) * t;

      const prev = points[Math.max(0, i - 1)];
      const next = points[Math.min(points.length - 1, i + 1)];

      const dx = next.x - prev.x;
      const dy = next.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;

      const nx = -dy / len;
      const ny = dx / len;

      left.push({
        x: p.x + nx * width / 2,
        y: p.y + ny * width / 2
      });

      right.push({
        x: p.x - nx * width / 2,
        y: p.y - ny * width / 2
      });
    });

    const all = [...left, ...right.reverse()];

    return 'M ' + all.map(p => `${p.x} ${p.y}`).join(' L ') + ' Z';
  }

  folds.forEach(fold => {
    const a = fold.angle;
    const dx = Math.cos(a);
    const dy = Math.sin(a) * 0.88;

    const nx = -dy;
    const ny = dx;

    const start = 19;
    const end = fold.length;
    const bend = fold.bend;

    const sx = x + dx * start;
    const sy = y + dy * start;
    const ex = x + dx * end;
    const ey = y + dy * end;

    const c1x = x + dx * (start + (end - start) * .33)
                  + nx * bend;
    const c1y = y + dy * (start + (end - start) * .33)
                  + ny * bend;

    const c2x = x + dx * (start + (end - start) * .72)
                  + nx * bend;
    const c2y = y + dy * (start + (end - start) * .72)
                  + ny * bend;

    // ベジェ曲線を細かく分割
    const points = [];

    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      const mt = 1 - t;

      points.push({
        x: mt**3 * sx +
           3 * mt**2 * t * c1x +
           3 * mt * t**2 * c2x +
           t**3 * ex,
        y: mt**3 * sy +
           3 * mt**2 * t * c1y +
           3 * mt * t**2 * c2y +
           t**3 * ey
      });
    }

    // ① 幅のある柔らかい影
    const soft = document.createElementNS(NS, 'path');
    soft.setAttribute(
      'd',
      taperedShape(points, 13, 8)
    );
    soft.setAttribute('fill', '#a96366');
    soft.setAttribute('opacity', .12 * amount);

    // ② 折れ目の暗い谷
    const dark = document.createElementNS(NS, 'path');
    dark.setAttribute(
      'd',
      taperedShape(points, 4.2, 2.4)
    );
    dark.setAttribute('fill', '#82484e');
    dark.setAttribute('opacity', .20 * amount);

    // ③ 谷の隣に添える柔らかい光
    const light = document.createElementNS(NS, 'path');

    const lightPoints = points.map(p => ({
      x: p.x + nx * 2.5,
      y: p.y + ny * 2.5
    }));

    light.setAttribute(
      'd',
      taperedShape(lightPoints, 2.2, 1.6)
    );
    light.setAttribute('fill', '#fff1e9');
    light.setAttribute('opacity', .28 * amount);

    wrinkles.appendChild(soft);
    wrinkles.appendChild(dark);
    wrinkles.appendChild(light);
  });
}


  function updateVisual() {
    if (!point || depth <= 0.001) {
      dent.style.opacity = '0';
      return;
    }

    dent.style.opacity = String(depth);

    shade.setAttribute('cx', point.x);
    shade.setAttribute('cy', point.y);
    shade.setAttribute('rx', 38 + depth * 42);
    shade.setAttribute('ry', (35 + depth * 38) * 0.88);

    drawWrinkles(point.x, point.y, depth);
  }

  function animate(now) {
    if (active) {
      const elapsed = (now - startTime) / 1000;

      depth = MAX_DEPTH *
        (1 - Math.exp(-elapsed / PRESS_SPEED));

      depth = Math.min(depth, MAX_DEPTH);
    }

    if (releasing) {
      const t = Math.min(
        1,
        (now - releaseStart) / RELEASE_DURATION
      );

      const eased = 1 - Math.pow(1 - t, 3);

      depth = releaseFrom * (1 - eased);

      if (t >= 1) {
        depth = 0;
        releasing = false;
        point = null;
        hint.textContent = '元の形に戻ったよ';
      }
    }

    updateVisual();

    if (active || releasing) {
      animationId = requestAnimationFrame(animate);
    } else {
      animationId = null;
    }
  }

  function startAnimation() {
    if (animationId === null) {
      animationId = requestAnimationFrame(animate);
    }
  }

  function press(e) {
    e.preventDefault();

    const p = localPoint(e);

    if (!insideCushion(p)) return;

    active = true;
    releasing = false;
    pointerId = e.pointerId;

    pad.setPointerCapture(pointerId);

    point = p;
    depth = 0;
    startTime = performance.now();

    hint.textContent = 'むにゅっ…';

    startAnimation();
  }

  function move(e) {
    if (!active || e.pointerId !== pointerId) return;

    e.preventDefault();

    point = localPoint(e);
    updateVisual();
  }

  function release(e) {
    if (!active) return;
    if (e && e.pointerId !== pointerId) return;

    active = false;
    pointerId = null;

    releasing = true;
    releaseStart = performance.now();
    releaseFrom = depth;

    startAnimation();
  }

  pad.addEventListener('pointerdown', press);
  pad.addEventListener('pointermove', move);
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);

  pad.addEventListener('selectstart', e => e.preventDefault());
  pad.addEventListener('dragstart', e => e.preventDefault());

  reset.addEventListener('click', () => {
    if (active) {
      active = false;
      pointerId = null;
    }

    releasing = true;
    releaseStart = performance.now();
    releaseFrom = depth;

    startAnimation();
  });

})();
</script>
</body>
</html>
